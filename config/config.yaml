data:
  file: data/jena_climate_2009_2016.csv
  resample_freq: 1h
  features:
    - T (degC)
    - p (mbar)
    - rh (%)
    - wv (m/s)
    - max. wv (m/s)
    - wd (deg)
  target: T (degC)
  split:
    train: 0.70
    val: 0.15
    test: 0.15

model:
  type: GRU
  units1: 128
  units2: 64
  dropout: 0.2

training:
  epochs: 30
  batch_size: 256
  learning_rate: 0.0005

forecast:
  strategy: 1-step ahead
